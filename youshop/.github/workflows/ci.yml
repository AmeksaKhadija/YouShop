# =====================================
# YOUSHOP - CI/CD PIPELINE
# =====================================
# Runs on: Push to develop/main, Pull requests
# Steps: Lint, Test, Build
# =====================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  # ===================================
  # LINT JOB
  # ===================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: youshop/package-lock.json

      - name: Install dependencies
        working-directory: ./youshop
        run: npm ci

      - name: Run ESLint
        working-directory: ./youshop
        run: npm run lint

      - name: Check formatting
        working-directory: ./youshop
        run: npm run format -- --check

  # ===================================
  # TEST JOB
  # ===================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: youshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: youshop/package-lock.json

      - name: Install dependencies
        working-directory: ./youshop
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./youshop
        run: npx prisma generate

      - name: Run database migrations
        working-directory: ./youshop
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/youshop_test?schema=public
        run: npx prisma migrate deploy

      - name: Run unit tests
        working-directory: ./youshop
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/youshop_test?schema=public
          JWT_SECRET: test-jwt-secret-for-ci
          NODE_ENV: test
        run: npm run test -- --coverage --passWithNoTests

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./youshop/coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # ===================================
  # BUILD JOB
  # ===================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: youshop/package-lock.json

      - name: Install dependencies
        working-directory: ./youshop
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./youshop
        run: npx prisma generate

      - name: Build application
        working-directory: ./youshop
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: youshop/dist
          retention-days: 7

  # ===================================
  # DOCKER BUILD JOB
  # ===================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ./youshop
        run: |
          docker build -t youshop-api:${{ github.sha }} .
          docker build -t youshop-api:latest .

      # Optional: Push to registry (uncomment when needed)
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # - name: Push to Docker Hub
      #   run: |
      #     docker tag youshop-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/youshop-api:latest
      #     docker push ${{ secrets.DOCKERHUB_USERNAME }}/youshop-api:latest
