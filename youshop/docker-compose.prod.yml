# =====================================
# YOUSHOP - DOCKER COMPOSE PRODUCTION
# =====================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =====================================

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: always
    environment:
      NODE_ENV: production
    volumes: []  # Remove source code mounts in production
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # Force password from env
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
